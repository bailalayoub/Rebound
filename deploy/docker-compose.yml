# Multi-instance demo and conformance target: Redis, two chat instances, nginx round-robin on :8080.
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  app-1: &app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: rebound-chat:dev
    environment:
      REBOUND_STORE: redis
      REDIS_ADDR: redis:6379
      INSTANCE_NAME: app-1
      CONFORMANCE: "1" # the conformance tester's endpoint; this deployment is a local demo
    depends_on:
      redis:
        condition: service_healthy

  app-2:
    <<: *app
    environment:
      REBOUND_STORE: redis
      REDIS_ADDR: redis:6379
      INSTANCE_NAME: app-2
      CONFORMANCE: "1"

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080" # local only: the demo has no authentication
    depends_on:
      - app-1
      - app-2
