# deploy/nginx.conf with its connection limits raised, for the stress campaign only
# (scripts/stress/nginx-tuned.yml). As shipped, `events {}` means one worker process with 512
# connections: about 250 proxied requests, below 200 streams with 1-3 readers each
# (docs/STRESS-v0.1.0.md, ramp-1). Everything below `http {` is deploy/nginx.conf unchanged.
worker_processes auto;
worker_rlimit_nofile 200000;

events {
  worker_connections 65536;
}
http {
  upstream chat {
    server app-1:8080;
    server app-2:8080;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://chat;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # SSE: no buffering, long reads (pings arrive every 15 s).
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      # Which instance answered, for the demo and the logs.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
