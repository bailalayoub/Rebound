# Load-test overlay on examples/deploy/docker-compose.yml (docs/benchmarks/v0.1.0/README.md): the stack itself is
# unchanged; it is pinned to CPUs 0-7 so the load generator (CPUs 8-11) does not steal its CPU,
# and each instance serves pprof/expvar on its own 127.0.0.1:6060 for the samplers, which join
# the instance's network namespace. The load generator reaches nginx on the compose network; nginx
# is published on 127.0.0.1:18080 rather than 8080, which another service holds on this machine.
#   docker compose -f examples/deploy/docker-compose.yml -f scripts/stress/compose.yml up -d --build
services:
  redis:
    cpuset: "0-7"
  app-1:
    cpuset: "0-7"
    environment:
      DEBUG_ADDR: 127.0.0.1:6060
  app-2:
    cpuset: "0-7"
    environment:
      DEBUG_ADDR: 127.0.0.1:6060
  nginx:
    cpuset: "0-7"
    ports: !override
      - "127.0.0.1:18080:8080"
