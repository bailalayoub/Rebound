# Plain round-robin over two instances: no ip_hash, no sticky sessions. A reconnecting client
# lands on either instance; the shared Redis log makes that invisible to it.
events {}

http {
  upstream chat {
    server app-1:8080;
    server app-2:8080;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://chat;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # SSE: no buffering, long reads (pings arrive every 15 s).
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      # Which instance answered, for the demo and the logs.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
