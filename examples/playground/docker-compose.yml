# Playground: the example chat UI on a real LLM, two instances behind nginx round-robin, one Redis.
# Settings come from playground/.env (copy .env.example; never commit .env). From the repo root:
#
#   docker compose -f playground/docker-compose.yml --env-file playground/.env up --build
#   docker compose -f playground/docker-compose.yml --env-file playground/.env down
#
# The UI listens on http://localhost:${DEMO_PORT} (default 8090), on this machine only.
name: rebound-playground

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  app-1: &app
    build:
      context: ..
      dockerfile: deploy/Dockerfile # the example chat image, as in deploy/
    image: rebound-chat:playground
    env_file: .env # LLM_PROVIDER, LLM_BASE_URL, LLM_API_KEY, LLM_MODEL, REBOUND_STORE…
    environment:
      REDIS_ADDR: redis:6379
      INSTANCE_NAME: app-1
    extra_hosts:
      - "host.docker.internal:host-gateway" # Ollama on the host; built in on Docker Desktop
    # Lets `docker compose stop app-1` shut down gracefully: the Hub waits up to 30 s for running
    # generations before ending them with server_shutdown.
    stop_grace_period: 45s
    depends_on:
      redis:
        condition: service_healthy

  app-2:
    <<: *app
    environment:
      REDIS_ADDR: redis:6379
      INSTANCE_NAME: app-2

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ../deploy/nginx.conf:/etc/nginx/nginx.conf:ro # plain round-robin, no sticky sessions
    ports:
      - "127.0.0.1:${DEMO_PORT:-8090}:8080" # local only: the demo has no authentication
    depends_on:
      - app-1
      - app-2
